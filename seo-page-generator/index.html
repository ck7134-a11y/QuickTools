<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEO Page Generator | QuickTools</title><meta name="description" content="アプリURLと説明、希望ページ数を入力するだけで、検索意図別の高品質なSEOランディングページとsitemap.xmlを一括生成するツール。"><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}header{background:linear-gradient(135deg,#111827,#1d4ed8);color:#fff;padding:34px 16px}header div,main{max-width:1080px;margin:auto}h1{margin:0;font-size:32px}header p{color:#dbeafe;line-height:1.7}.card{background:#fff;border:1px solid #dbe1ea;border-radius:20px;padding:20px;margin:18px 0;box-shadow:0 10px 30px rgba(15,23,42,.06)}main{padding:0 12px 56px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:12px;color:#667085;margin-bottom:6px;font-weight:700}input,textarea,select{width:100%;padding:12px;border:1px solid #dbe1ea;border-radius:12px;font:inherit;background:#fff}textarea{min-height:125px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:12px;padding:12px 17px;font-weight:800;background:#2563eb;color:#fff;cursor:pointer}button.secondary{background:#eef2f7;color:#25324a}.hint{font-size:12px;color:#667085;line-height:1.7}.status{margin-top:12px;color:#166534;font-size:13px;font-weight:700}.table{overflow:auto}.item{display:grid;grid-template-columns:50px 1.1fr 1.7fr 1fr;gap:10px;padding:12px 0;border-top:1px solid #eef1f5;align-items:center}.item:first-child{border-top:0}.pill{font-size:11px;background:#eef2ff;color:#3730a3;padding:5px 8px;border-radius:999px;display:inline-block;font-weight:800}.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px;border-radius:14px;font-size:12px;line-height:1.7}.score{display:inline-flex;align-items:center;gap:6px;background:#ecfdf3;color:#067647;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}@media(max-width:700px){.grid,.item{grid-template-columns:1fr}h1{font-size:28px}}</style></head>
<body><header><div><h1>SEO Page Generator</h1><p>URL・説明・ページ数から、検索意図ごとに構成を変えた見やすいSEOランディングページを一括生成</p></div></header><main>
<section class="card"><div class="grid"><div><label>アプリURL</label><input id="url" placeholder="https://example.com/tool/"></div><div><label>希望ページ数</label><input id="count" type="number" min="5" max="100" value="30"></div></div><div style="margin-top:12px"><label>アプリの簡単な説明</label><textarea id="desc" placeholder="例：画像を500KB・1MBなど指定容量まで無料で圧縮できるブラウザツール。複数画像をまとめて処理できる。"></textarea></div><div class="grid" style="margin-top:12px"><div><label>サイト名</label><input id="site" value="My Tool"></div><div><label>主な対象ユーザー（任意）</label><input id="audience" placeholder="会社員、学生、EC担当者など"></div></div><div class="grid" style="margin-top:12px"><div><label>強み・差別化（任意）</label><input id="benefit" placeholder="無料、登録不要、ブラウザ内処理など"></div><div><label>ブランドカラー（任意）</label><input id="accent" type="color" value="#2563eb"></div></div><div class="actions"><button id="generate">高品質SEOページ案を生成</button><button id="demo" class="secondary">FileFitの例を入力</button></div><div id="status" class="status"></div></section>
<section class="card"><h2>生成予定ページ <span id="n">0</span>件</h2><p class="hint">用途・悩み・条件・安全性・比較・端末・対象者など、検索意図を分散させて生成します。</p><div id="list" class="table"><div class="hint">まだ生成されていません。</div></div></section>
<section class="card"><div class="warn">アクセス増加は保証できません。大量生成よりも、検索意図ごとに役立つ内容・独自性・実際に使えるCTAを持つページを公開することを優先してください。このツールは重複を減らす構成で生成します。</div><div class="actions"><button id="download" disabled>SEOページ一式をZIP保存</button><button id="clear" class="secondary">クリア</button></div></section>
</main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let pages=[];
const themes=[
{cat:'具体条件',q:'500KB以下にする',lead:'容量制限にすぐ対応',problem:'アップロード上限に引っかかる',tip:'まず500KBを目標に設定し、画質とのバランスを確認します。'},
{cat:'具体条件',q:'1MB以下にする',lead:'1MB制限をスムーズにクリア',problem:'メールやフォームで1MB制限がある',tip:'提出先の上限が1MBなら、少し余裕を持って900KB前後を狙うと安心です。'},
{cat:'具体条件',q:'2MB以下にする',lead:'2MBまで簡単にサイズ調整',problem:'スマホ写真や資料が大きい',tip:'画像枚数が多い場合は一括処理で作業時間を短縮できます。'},
{cat:'具体条件',q:'5MB以下にする',lead:'大きなファイルを軽量化',problem:'送信や保存に時間がかかる',tip:'高解像度データは必要以上に画質を落とさず段階的に縮小します。'},
{cat:'用途',q:'メール添付に使う',lead:'送れないをすぐ解決',problem:'メール添付の容量を超えてしまう',tip:'添付先の上限より少し小さめを目標にすると送信エラーを減らせます。'},
{cat:'用途',q:'Webフォーム提出に使う',lead:'提出前の容量調整を簡単に',problem:'フォームのファイル容量制限に合わない',tip:'提出条件の形式と容量を確認してから処理すると失敗を減らせます。'},
{cat:'用途',q:'仕事で使う',lead:'業務ファイルをすばやく処理',problem:'資料を共有しやすいサイズにしたい',tip:'複数ファイル対応なら会議資料や商品画像の一括処理に向きます。'},
{cat:'用途',q:'学校提出で使う',lead:'提出用ファイルを手早く準備',problem:'学校の提出サイトに容量制限がある',tip:'提出前にファイル名と最終容量を確認します。'},
{cat:'用途',q:'EC商品画像で使う',lead:'商品画像を軽くして表示も快適に',problem:'商品画像が重くページ表示が遅い',tip:'見た目を保ちながら容量を下げるとECページの扱いやすさが上がります。'},
{cat:'端末',q:'スマホで使う',lead:'スマホだけで完結',problem:'PCを使わずに処理したい',tip:'ブラウザ対応ならアプリのインストールなしで使えます。'},
{cat:'端末',q:'PCで使う',lead:'ドラッグ操作で効率よく処理',problem:'大量ファイルを効率よく扱いたい',tip:'複数選択と一括保存があるとPC作業が効率化します。'},
{cat:'安全',q:'安全に使う',lead:'ファイルの扱いを確認して安心利用',problem:'機密ファイルをアップロードしたくない',tip:'端末内処理かサーバー送信かをサービス説明で必ず確認します。'},
{cat:'安全',q:'アップロードせず使う',lead:'プライバシーを重視して処理',problem:'外部サーバーにファイルを送りたくない',tip:'ブラウザ内処理型ツールなら、通常は端末内だけで処理できます。'},
{cat:'比較',q:'無料ツールを選ぶ',lead:'無料でも使いやすいサービスを選ぶ',problem:'どの無料ツールを選べばよいか分からない',tip:'料金だけでなく、上限・広告・安全性・一括処理を比較します。'},
{cat:'比較',q:'登録不要で使う',lead:'すぐ使えて手間が少ない',problem:'アカウント登録が面倒',tip:'単発作業なら登録不要のブラウザツールが便利です。'},
{cat:'悩み',q:'画質を落とさず小さくする',lead:'見た目と容量のバランスを重視',problem:'圧縮すると画像がぼやける',tip:'一度に強く圧縮せず、必要な容量まで段階的に下げます。'},
{cat:'悩み',q:'複数ファイルをまとめて処理する',lead:'一括処理で作業時間を短縮',problem:'1ファイルずつ処理するのが面倒',tip:'一括選択とZIP保存があるサービスを選ぶと効率的です。'},
{cat:'悩み',q:'ファイルが大きすぎる時に使う',lead:'大容量ファイルを扱いやすく',problem:'保存・送信・アップロードに時間がかかる',tip:'用途に必要な画質を残しつつ、不要な容量を削ります。'},
{cat:'質問',q:'うまく処理できない時の対処法',lead:'失敗しやすいポイントを先に確認',problem:'処理が止まる、容量が下がらない',tip:'対応形式、元ファイルの破損、ブラウザのメモリ不足を確認します。'},
{cat:'質問',q:'どこまで小さくできるか確認する',lead:'容量と品質の限界を理解',problem:'希望容量まで下がらない',tip:'元データやページ数によっては、画質を大きく落とさない限り目標未達になることがあります。'}
];
function coreKeyword(desc){const m=desc.match(/(画像|写真|PDF|ファイル|動画|音声|CSV|Excel|Word|アプリ|ツール)/);return m?m[1]:'ファイル'}
function slugify(s,i){return 'guide-'+String(i+1).padStart(3,'0')+'-'+s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30)}
function generate(){const url=$('url').value.trim(),desc=$('desc').value.trim(),site=$('site').value.trim()||'My Tool',aud=$('audience').value.trim(),want=Math.max(5,Math.min(100,+$('count').value||30));if(!url||!desc){$('status').textContent='アプリURLと説明を入力してください。';return}const core=coreKeyword(desc),items=[];for(let i=0;i<want;i++){const t=themes[i%themes.length],cycle=Math.floor(i/themes.length),extra=cycle?['初心者向け','無料で','簡単に','すぐに'][cycle%4]+' ':'';const keyword=`${core} ${extra}${t.q}`.trim();items.push({cat:t.cat,keyword,title:`${core}を${extra}${t.q}方法｜${site}`,slug:slugify(keyword,i),lead:t.lead,problem:t.problem,tip:t.tip,url,desc,aud});}pages=items;render();$('status').textContent=`${pages.length}件のSEOページ案を生成しました。`}
function render(){$('n').textContent=pages.length;$('download').disabled=!pages.length;if(!pages.length){$('list').innerHTML='<div class="hint">まだ生成されていません。</div>';return}$('list').innerHTML=pages.map((p,i)=>`<div class="item"><div>${i+1}</div><div><span class="pill">${esc(p.cat)}</span><br>${esc(p.keyword)}</div><div>${esc(p.title)}<br><span class="score">✓ 検索意図別構成</span></div><div>${esc(p.slug)}</div></div>`).join('')}
function htmlFor(p,idx){const site=esc($('site').value.trim()||'My Tool'),desc=esc($('desc').value.trim()),aud=esc($('audience').value.trim()),benefit=esc($('benefit').value.trim()),accent=$('accent').value||'#2563eb',u=esc(p.url),kw=esc(p.keyword),title=esc(p.title),lead=esc(p.lead),problem=esc(p.problem),tip=esc(p.tip);const related=pages.filter((_,i)=>i!==idx).slice(Math.max(0,idx-2),Math.max(0,idx-2)+4);const relatedHtml=related.map(r=>`<a class="related" href="../${esc(r.slug)}/">${esc(r.keyword)}</a>`).join('');const faq=[['無料で使えますか？','利用条件はサービス本体の案内をご確認ください。'],['スマートフォンでも使えますか？','ブラウザ対応のサービスであれば、スマートフォンからも利用できます。'],['安全に使えますか？','ファイルの処理方式や保存方法をサービス本体で確認してください。'],['希望の容量まで必ず小さくできますか？','元ファイルの内容や画質によっては、希望容量まで下げられない場合があります。']];const faqJson=JSON.stringify({'@context':'https://schema.org','@type':'FAQPage','mainEntity':faq.map(x=>({'@type':'Question','name':x[0],'acceptedAnswer':{'@type':'Answer','text':x[1]}}))});return `<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${title}</title><meta name="description" content="${lead}。${desc} ${kw}を探している方向けに、使い方・注意点・よくある質問を分かりやすく紹介します。"><meta name="robots" content="index,follow"><meta property="og:title" content="${title}"><meta property="og:description" content="${lead}。${desc}"><meta property="og:type" content="article"><script type="application/ld+json">${faqJson}<\/script><style>:root{--a:${accent};--ink:#172033;--muted:#667085;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif}a{color:inherit}.hero{background:linear-gradient(135deg,#0f172a,var(--a));color:#fff;padding:56px 18px 48px}.wrap{max-width:960px;margin:auto}.eyebrow{display:inline-block;padding:7px 10px;border:1px solid #ffffff55;border-radius:999px;font-size:12px;font-weight:800}.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.15;margin:18px 0 12px;max-width:800px}.hero p{max-width:720px;color:#e7edf8;line-height:1.8;font-size:17px}.heroBtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{display:inline-block;background:#fff;color:#111827;text-decoration:none;font-weight:900;padding:14px 20px;border-radius:13px;box-shadow:0 8px 24px #0002}.ghost{background:#ffffff18;color:#fff;border:1px solid #ffffff55}.main{max-width:960px;margin:-22px auto 0;padding:0 14px 56px}.quick{background:#fff;border-radius:20px;padding:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;box-shadow:0 14px 34px #0f172a14;border:1px solid #e5e7eb}.quick div{padding:10px}.quick b{display:block;margin-bottom:5px}.quick span{color:var(--muted);font-size:13px;line-height:1.6}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:24px;margin-top:18px;box-shadow:0 8px 22px #0f172a0a}.card h2{font-size:25px;margin:0 0 12px}.card p,.card li{line-height:1.9;color:#475467}.problem{border-left:5px solid var(--a);background:#f8fbff}.steps{counter-reset:s}.step{display:grid;grid-template-columns:42px 1fr;gap:12px;margin:16px 0}.step:before{counter-increment:s;content:counter(s);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--a);color:#fff;font-weight:900}.note{background:#fffbeb;border:1px solid #fde68a;border-radius:14px;padding:14px}.faq details{border-top:1px solid #e5e7eb;padding:15px 0}.faq summary{cursor:pointer;font-weight:800}.relatedGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.related{display:block;text-decoration:none;border:1px solid #e5e7eb;border-radius:13px;padding:13px;background:#fafafa;font-weight:700}.cta{background:linear-gradient(135deg,#111827,var(--a));color:#fff;text-align:center}.cta p{color:#dbeafe}.cta .btn{margin-top:8px}@media(max-width:700px){.quick,.relatedGrid{grid-template-columns:1fr}.hero{padding-top:38px}.hero h1{font-size:34px}}</style></head><body><section class="hero"><div class="wrap"><span class="eyebrow">${site} ガイド</span><h1>${title}</h1><p>${lead}。${desc}</p><div class="heroBtns"><a class="btn" href="${u}">今すぐアプリを使う</a><a class="btn ghost" href="#howto">使い方を見る</a></div></div></section><main class="main"><section class="quick"><div><b>こんな悩みに</b><span>${problem}</span></div><div><b>おすすめポイント</b><span>${benefit||'ブラウザですぐ使えて、目的に合わせて手軽に処理できます。'}</span></div><div><b>対象</b><span>${aud||'はじめて使う方から日常・仕事で使う方まで'}</span></div></section><section class="card problem"><h2>${kw}を探している方へ</h2><p>${problem}という場面では、難しい設定よりも「目的の条件にすぐ合わせられること」が重要です。${desc}</p><p><strong>ポイント：</strong> ${tip}</p></section><section class="card" id="howto"><h2>3ステップで使えます</h2><div class="step"><div><b>アプリを開く</b><p>${site}をブラウザで開きます。</p></div></div><div class="step"><div><b>ファイルや条件を設定</b><p>対象ファイルを選び、必要な容量や形式などを設定します。</p></div></div><div class="step"><div><b>結果を確認して保存</b><p>処理後の容量や品質を確認し、問題なければ保存します。</p></div></div><a class="btn" style="background:var(--a);color:#fff" href="${u}">${site}を使ってみる</a></section><section class="card"><h2>失敗しにくくするコツ</h2><p class="note">${tip}</p><ul><li>提出先やサービス側の容量・形式条件を先に確認する</li><li>必要以上に圧縮して品質を落としすぎない</li><li>処理後のファイルを実際に開いて確認する</li></ul></section><section class="card faq"><h2>よくある質問</h2>${faq.map(x=>`<details><summary>${esc(x[0])}</summary><p>${esc(x[1])}</p></details>`).join('')}</section><section class="card"><h2>関連するガイド</h2><div class="relatedGrid">${relatedHtml}</div></section><section class="card cta"><h2>${kw}を今すぐ試す</h2><p>${lead}。アプリ本体からすぐに始められます。</p><a class="btn" href="${u}">${site}を開く</a></section></main></body></html>`}
$('generate').onclick=generate;$('demo').onclick=()=>{$('url').value='https://ck7134-a11y.github.io/QuickTools/file-compressor/';$('desc').value='画像を500KB・1MBなど指定容量まで無料で圧縮できるブラウザツール。複数画像をまとめて処理でき、ZIP保存にも対応。';$('site').value='FileFit';$('audience').value='会社員、学生、EC担当者';$('benefit').value='無料・登録不要・複数画像対応・ブラウザ内処理';$('count').value=30};$('clear').onclick=()=>{pages=[];render();$('status').textContent='クリアしました。'};
$('download').onclick=async()=>{if(!pages.length)return;const z=new JSZip(),base=$('url').value.trim().replace(/\/$/,'');pages.forEach((p,i)=>z.file(`${p.slug}/index.html`,htmlFor(p,i)));const sm=pages.map(p=>`  <url><loc>${base}/${p.slug}/</loc></url>`).join('\n');z.file('sitemap.xml',`<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n${sm}\n</urlset>`);z.file('seo-pages.csv','category,keyword,title,slug\n'+pages.map(p=>[p.cat,p.keyword,p.title,p.slug].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'));const b=await z.generateAsync({type:'blob'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='seo-pages-high-quality.zip';a.click();setTimeout(()=>URL.revokeObjectURL(u),10000);$('status').textContent=`${pages.length}ページ分をZIP保存しました。`};render();
</script></body></html>
