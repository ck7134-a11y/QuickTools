<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEO Page Generator | QuickTools</title><meta name="description" content="アプリURLと説明、希望ページ数を入力するだけでSEOページ案とHTML、sitemap.xmlを一括生成するツール。"><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}header{background:#111827;color:#fff;padding:24px 16px}header div,main{max-width:1000px;margin:auto}h1{margin:0;font-size:28px}header p{color:#cbd5e1}.card{background:#fff;border:1px solid #dbe1ea;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 8px 24px #0f172a0d}main{padding:0 12px 48px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:12px;color:#6b7280;margin-bottom:5px}input,textarea,select{width:100%;padding:11px;border:1px solid #dbe1ea;border-radius:10px;font:inherit}textarea{min-height:120px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:11px;padding:12px 16px;font-weight:700;background:#2563eb;color:#fff;cursor:pointer}button.secondary{background:#eef2f7;color:#25324a}.hint{font-size:12px;color:#6b7280;line-height:1.6}.status{margin-top:12px;color:#166534;font-size:13px}.table{overflow:auto}.item{display:grid;grid-template-columns:50px 1.2fr 1.8fr 1fr;gap:8px;padding:10px 0;border-top:1px solid #eef1f5;align-items:center}.item:first-child{border-top:0}.pill{font-size:11px;background:#eef2ff;color:#3730a3;padding:4px 7px;border-radius:999px;display:inline-block}.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:10px;border-radius:12px;font-size:12px;line-height:1.6}@media(max-width:700px){.grid,.item{grid-template-columns:1fr}}</style></head>
<body><header><div><h1>SEO Page Generator</h1><p>URL・説明・ページ数だけで、集客用SEOページを自動設計して一括生成</p></div></header><main>
<section class="card"><div class="grid"><div><label>アプリURL</label><input id="url" placeholder="https://example.com/tool/"></div><div><label>希望ページ数</label><input id="count" type="number" min="5" max="200" value="30"></div></div><div style="margin-top:12px"><label>アプリの簡単な説明</label><textarea id="desc" placeholder="例：画像を500KB・1MBなど指定容量まで無料で圧縮できるブラウザツール。複数画像をまとめて処理できる。"></textarea></div><div class="grid" style="margin-top:12px"><div><label>サイト名</label><input id="site" value="My Tool"></div><div><label>主な対象ユーザー（任意）</label><input id="audience" placeholder="会社員、学生、EC担当者など"></div></div><div class="actions"><button id="generate">SEOページ案を自動生成</button><button id="demo" class="secondary">FileFitの例を入力</button></div><div id="status" class="status"></div></section>
<section class="card"><h2>生成予定ページ <span id="n">0</span>件</h2><div id="list" class="table"><div class="hint">まだ生成されていません。</div></div></section>
<section class="card"><div class="warn">検索意図がほぼ同じページを大量公開すると逆効果になることがあります。このツールでは用途・対象者・課題・比較・容量条件・デバイスなどを組み合わせ、重複を減らして生成します。</div><div class="actions"><button id="download" disabled>SEOページ一式をZIP保存</button><button id="clear" class="secondary">クリア</button></div></section>
</main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let pages=[];
const themes=[
['目的','無料で使う方法'],['目的','初心者向けの使い方'],['目的','スマホで使う方法'],['目的','PCで使う方法'],['目的','仕事で使う方法'],['目的','学校提出で使う方法'],['目的','メール添付に使う方法'],['目的','Webフォーム提出に使う方法'],
['悩み','容量制限で送れない時の対処法'],['悩み','ファイルが大きすぎる時の解決方法'],['悩み','画質をできるだけ落とさず使う方法'],['悩み','複数ファイルをまとめて処理する方法'],
['比較','無料ツールの選び方'],['比較','オンラインツールとの違い'],['比較','インストール不要で使う方法'],['安全','安全に使える理由'],['安全','ファイルをアップロードせず使う方法'],
['用途','会社資料で使う方法'],['用途','履歴書や応募書類で使う方法'],['用途','EC商品画像で使う方法'],['用途','SNS投稿用に使う方法'],['用途','行政手続きで使う方法'],
['具体条件','500KB以下にする方法'],['具体条件','1MB以下にする方法'],['具体条件','2MB以下にする方法'],['具体条件','5MB以下にする方法'],['具体条件','10MB以下にする方法'],
['形式','JPGで使う方法'],['形式','PNGで使う方法'],['形式','WebPで使う方法'],['形式','PDFで使う方法'],['形式','画像をまとめて扱う方法'],
['質問','よくある失敗と対処法'],['質問','うまく処理できない時の確認点'],['質問','どこまで小さくできるか'],['質問','処理後の品質を確認する方法'],['質問','無料と有料ツールの違い']
];
function slugify(s,i){return 'seo-'+String(i+1).padStart(3,'0')+'-'+s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,35)}
function coreKeyword(desc){const m=desc.match(/(画像|写真|PDF|ファイル|動画|音声|CSV|Excel|Word|アプリ|ツール)/);return m?m[1]:'アプリ'}
function generate(){const url=$('url').value.trim(),desc=$('desc').value.trim(),site=$('site').value.trim()||'My Tool',aud=$('audience').value.trim(),want=Math.max(5,Math.min(200,+$('count').value||30));if(!url||!desc){$('status').textContent='アプリURLと説明を入力してください。';return}const core=coreKeyword(desc),base=[];for(const [cat,suffix] of themes){base.push({cat,keyword:`${core} ${suffix.replace('する方法','')}`,title:`${core}を${suffix}｜${site}`,intent:`${aud?aud+'向け。':''}${desc}`})}let i=0;while(base.length<want){const t=themes[i%themes.length],variant=i%4===0?'おすすめ':i%4===1?'簡単':i%4===2?'無料':'ブラウザ';base.push({cat:t[0],keyword:`${core} ${variant} ${t[1].replace('する方法','')}`,title:`${core}を${variant}に${t[1]}｜${site}`,intent:`${aud?aud+'向け。':''}${desc}`});i++}pages=base.slice(0,want).map((p,i)=>({...p,slug:slugify(p.keyword,i),url}));render();$('status').textContent=`${pages.length}件のSEOページ案を生成しました。`}
function render(){ $('n').textContent=pages.length;$('download').disabled=!pages.length;if(!pages.length){$('list').innerHTML='<div class="hint">まだ生成されていません。</div>';return}$('list').innerHTML=pages.map((p,i)=>`<div class="item"><div>${i+1}</div><div><span class="pill">${esc(p.cat)}</span><br>${esc(p.keyword)}</div><div>${esc(p.title)}</div><div>${esc(p.slug)}</div></div>`).join('')}
function htmlFor(p){const site=esc($('site').value.trim()||'My Tool'),desc=esc($('desc').value.trim()),aud=esc($('audience').value.trim()),u=esc(p.url),kw=esc(p.keyword),title=esc(p.title);return `<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${title}</title><meta name="description" content="${desc} ${kw}について分かりやすく紹介します。"><meta name="robots" content="index,follow"><style>body{margin:0;background:#f7f8fb;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif}header{background:#111827;color:#fff;padding:30px 16px}header div,main{max-width:860px;margin:auto}main{padding:24px 14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;margin-bottom:16px}.btn{display:inline-block;background:#2563eb;color:white;padding:13px 18px;border-radius:10px;text-decoration:none;font-weight:700}p,li{line-height:1.9;color:#4b5563}</style></head><body><header><div><strong>${site}</strong><h1>${title}</h1></div></header><main><section class="card"><p>${desc}</p>${aud?`<p>特に${aud}におすすめです。</p>`:''}<a class="btn" href="${u}">アプリを使う</a></section><section class="card"><h2>${kw}で困っている方へ</h2><p>${kw}を探している方が、迷わず目的を達成できるようにポイントを整理しました。まずは対象ファイルや入力内容を準備し、上のボタンからアプリを開いてください。</p><h2>使い方</h2><ol><li>アプリを開きます。</li><li>必要なファイルや情報を入力します。</li><li>処理結果を確認して保存・利用します。</li></ol><h2>この方法が向いているケース</h2><p>${desc}</p><h2>よくある質問</h2><h3>無料で使えますか？</h3><p>利用条件はアプリ本体の案内をご確認ください。</p><h3>スマホでも使えますか？</h3><p>ブラウザで利用できるアプリであれば、スマートフォンでも利用できます。</p><h3>安全に使えますか？</h3><p>ファイルの処理方法や保存方法はアプリ本体の説明をご確認ください。</p><p><a class="btn" href="${u}">今すぐ使う</a></p></section></main></body></html>`}
$('generate').onclick=generate;$('demo').onclick=()=>{$('url').value='https://ck7134-a11y.github.io/QuickTools/file-compressor/';$('desc').value='画像を500KB・1MBなど指定容量まで無料で圧縮できるブラウザツール。複数画像をまとめて処理でき、ZIP保存にも対応。';$('site').value='FileFit';$('audience').value='会社員、学生、EC担当者';$('count').value=30};$('clear').onclick=()=>{pages=[];render();$('status').textContent='クリアしました。'};
$('download').onclick=async()=>{if(!pages.length)return;const z=new JSZip(),base=$('url').value.trim().replace(/\/$/,'');pages.forEach(p=>z.file(`${p.slug}/index.html`,htmlFor(p)));const sm=pages.map(p=>`  <url><loc>${base}/${p.slug}/</loc></url>`).join('\n');z.file('sitemap.xml',`<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n${sm}\n</urlset>`);z.file('seo-pages.csv','category,keyword,title,slug\n'+pages.map(p=>[p.cat,p.keyword,p.title,p.slug].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'));const b=await z.generateAsync({type:'blob'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='seo-pages-auto-generated.zip';a.click();setTimeout(()=>URL.revokeObjectURL(u),10000);$('status').textContent=`${pages.length}ページ分をZIP保存しました。`};render();
</script></body></html>
