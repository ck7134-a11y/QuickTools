<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EC画像トリミング｜QuickTools</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>:root{--a:#5b5cf0;--b:#7c3aed;--bg:#f7f8fb;--ink:#151821;--muted:#737a8c;--line:#e6e8ef;--soft:#f3f1ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#eeeafe,#f7f8fb 35%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink)}.shell{max-width:1180px;margin:auto;padding:0 18px}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0}.brand{display:flex;align-items:center;gap:11px;font-weight:900}.q{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;color:#fff;box-shadow:0 8px 22px #5b5cf040}.mini,.meta{font-size:12px;color:var(--muted)}.hero{text-align:center;padding:45px 0 28px}.hero h1{font-size:clamp(36px,6vw,62px);line-height:1.06;letter-spacing:-.05em;margin:0}.grad{background:linear-gradient(90deg,var(--a),var(--b));background-clip:text;-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 360px;gap:18px}.card{background:#fffffff2;border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 50px #18182812;padding:20px}.drop{min-height:260px;border:1.5px dashed #c7c9d4;border-radius:20px;display:grid;place-items:center;text-align:center}.drop.drag{background:var(--soft);border-color:var(--a)}.ico{width:64px;height:64px;border-radius:18px;background:var(--soft);display:grid;place-items:center;margin:auto;font-size:28px}.pick,.primary{display:inline-block;border:0;background:linear-gradient(90deg,var(--a),var(--b));color:#fff;padding:12px 18px;border-radius:12px;font-weight:850;cursor:pointer}.pick input{display:none}.fields,.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:11px;color:var(--muted);font-weight:750;margin:0 0 5px}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff}.full{grid-column:1/-1}.primary{width:100%;margin-top:14px}.list{margin:18px 0 60px}.head{display:flex;justify-content:space-between;align-items:center}.secondary{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;font-weight:800;cursor:pointer}.item{display:grid;grid-template-columns:220px 1fr;gap:18px;padding:18px 0;border-top:1px solid #eff0f4}.preview{width:220px;aspect-ratio:1;background:#f2f3f7;border-radius:16px;overflow:hidden}.preview canvas{width:100%;height:100%;object-fit:contain}.fname{font-weight:850}.ranges{margin-top:14px;display:grid;gap:9px}.range{display:grid;grid-template-columns:85px 1fr 44px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}.range input{width:100%}.badge{background:var(--soft);color:var(--a);padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}.empty{text-align:center;color:var(--muted);padding:30px}.actions{display:flex;gap:8px}.privacy{margin-top:12px;background:#f7fbf8;color:#47705a;padding:11px;border-radius:12px;font-size:12px}@media(max-width:850px){.grid{grid-template-columns:1fr}.item{grid-template-columns:150px 1fr}.preview{width:150px}}@media(max-width:600px){.mini{display:none}.item{grid-template-columns:1fr}.preview{width:100%}.fields,.controls{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="shell"><header class="top"><div class="brand"><div class="q">Q</div>QuickTools</div><div class="mini">Apparel EC Image Cropper</div></header><section class="hero"><h1>撮影画像を、<span class="grad">ECで映える構図</span>に。</h1><p>トリミングと明るさ調整をまとめて。指定サイズ・DPIで一括保存できます。</p></section><main class="grid"><section class="card"><div id="drop" class="drop"><div><div class="ico">▣</div><h2>撮影画像を追加</h2><p class="meta">JPG / PNG / WebP・複数選択OK</p><label class="pick">画像を選択<input id="pick" type="file" accept="image/*" multiple></label></div></div><div class="privacy">🔒 画像はブラウザ内で処理します。</div></section><aside class="card"><h3>出力設定</h3><div class="fields"><div class="field"><label>横幅 px</label><input id="outW" type="number" value="1280"></div><div class="field"><label>縦幅 px</label><input id="outH" type="number" value="1280"></div><div class="field"><label>DPI</label><input id="dpi" type="number" value="350"></div><div class="field"><label>JPEG画質</label><select id="quality"><option value=".94">高画質</option><option value=".90" selected>標準</option><option value=".84">軽量</option></select></div><div class="field full"><label>初期構図</label><select id="defaultType"><option value="top">トップス：頭＋商品全体</option><option value="bottom">ボトム：商品を大きく</option><option value="full">全身：全体を収める</option></select></div></div><button id="applyAll" class="primary">設定を全画像に反映</button></aside></main><section class="card list"><div class="head"><h3>プレビュー・画像補正</h3><div class="actions"><button id="resetAll" class="secondary">補正をリセット</button><button id="zip" class="secondary" disabled>すべてZIP保存</button></div></div><div id="list" class="empty">画像を追加するとプレビューが表示されます。</div></section></div><script>const $=x=>document.getElementById(x);let items=[];const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function load(f){return new Promise((r,j)=>{let i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{URL.revokeObjectURL(u);r(i)};i.onerror=j;i.src=u})}function rect(it){let im=it.img,ratio=(+$('outW').value)/(+$('outH').value),w=im.width,h=im.height,cx=w/2,cy=h/2;if(it.type==='top'){h*=.82;cy=h*.52}else if(it.type==='bottom'){h*=.76;cy=im.height*.62}else{h*=.96}let cw=w*.92,ch=h;if(cw/ch<ratio)cw=ch*ratio;else ch=cw/ratio;cw/=it.zoom/100;ch/=it.zoom/100;cy+=ch*it.yoff/100;cw=Math.min(cw,w);ch=Math.min(ch,im.height);cx=Math.max(cw/2,Math.min(w-cw/2,cx));cy=Math.max(ch/2,Math.min(im.height-ch/2,cy));return{x:cx-cw/2,y:cy-ch/2,w:cw,h:ch}}function filter(it){return`brightness(${100+it.bright}%) contrast(${100+it.contrast}%) saturate(${100+it.sat}%)`}function draw(it){let c=$('c'+it.id);if(!c)return;c.width=360;c.height=360*(+$('outH').value)/(+$('outW').value);let x=c.getContext('2d'),r=rect(it);x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.filter=filter(it);x.drawImage(it.img,r.x,r.y,r.w,r.h,0,0,c.width,c.height);x.filter='none'}function render(){if(!items.length){$('list').className='empty';$('list').textContent='画像を追加するとプレビューが表示されます。';$('zip').disabled=true;return}$('list').className='';$('zip').disabled=false;$('list').innerHTML=items.map(it=>`<div class="item"><div class="preview"><canvas id="c${it.id}"></canvas></div><div><div class="head"><div><div class="fname">${esc(it.file.name)}</div><div class="meta">${it.img.width} × ${it.img.height}px</div></div><span class="badge">${it.type.toUpperCase()}</span></div><div class="controls"><div class="field"><label>商品種別</label><select data-id="${it.id}" data-k="type"><option value="top" ${it.type==='top'?'selected':''}>トップス</option><option value="bottom" ${it.type==='bottom'?'selected':''}>ボトム</option><option value="full" ${it.type==='full'?'selected':''}>全身</option></select></div><div class="field"><label>ズーム</label><select data-id="${it.id}" data-k="zoom"><option value="90">少し引く</option><option value="100" ${it.zoom==100?'selected':''}>標準</option><option value="112" ${it.zoom==112?'selected':''}>少し寄る</option><option value="125" ${it.zoom==125?'selected':''}>大きく</option></select></div></div><div class="ranges"><div class="range"><span>上下位置</span><input type="range" min="-35" max="35" value="${it.yoff}" data-id="${it.id}" data-k="yoff"><b>${it.yoff}</b></div><div class="range"><span>明るさ</span><input type="range" min="-50" max="50" value="${it.bright}" data-id="${it.id}" data-k="bright"><b>${it.bright}</b></div><div class="range"><span>コントラスト</span><input type="range" min="-30" max="30" value="${it.contrast}" data-id="${it.id}" data-k="contrast"><b>${it.contrast}</b></div><div class="range"><span>彩度</span><input type="range" min="-30" max="30" value="${it.sat}" data-id="${it.id}" data-k="sat"><b>${it.sat}</b></div></div><div style="margin-top:12px"><button class="secondary" onclick="resetOne('${it.id}')">補正リセット</button> <button class="secondary" onclick="saveOne('${it.id}')">JPEG保存</button></div></div></div>`).join('');document.querySelectorAll('[data-id]').forEach(e=>{e.oninput=()=>{let it=items.find(x=>x.id===e.dataset.id),k=e.dataset.k;it[k]=['type'].includes(k)?e.value:+e.value;if(e.type==='range')e.nextElementSibling.textContent=e.value;draw(it)};e.onchange=e.oninput});items.forEach(draw)}async function add(fs){for(let f of fs){if(!f.type.startsWith('image/'))continue;let im=await load(f);items.push({id:Math.random().toString(36).slice(2),file:f,img:im,type:$('defaultType').value,zoom:100,yoff:0,bright:0,contrast:0,sat:0})}render()}$('pick').onchange=e=>{add([...e.target.files]);e.target.value=''};['dragover','dragenter'].forEach(n=>$('drop').addEventListener(n,e=>{e.preventDefault();$('drop').classList.add('drag')}));['dragleave','drop'].forEach(n=>$('drop').addEventListener(n,e=>{e.preventDefault();$('drop').classList.remove('drag')}));$('drop').ondrop=e=>add([...e.dataTransfer.files]);$('applyAll').onclick=()=>{items.forEach(i=>i.type=$('defaultType').value);render()};function resetOne(id){let i=items.find(x=>x.id===id);i.bright=i.contrast=i.sat=0;render()}$('resetAll').onclick=()=>{items.forEach(i=>i.bright=i.contrast=i.sat=0);render()};async function output(it){let c=document.createElement('canvas'),w=+$('outW').value,h=+$('outH').value;c.width=w;c.height=h;let x=c.getContext('2d'),r=rect(it);x.fillStyle='#fff';x.fillRect(0,0,w,h);x.filter=filter(it);x.drawImage(it.img,r.x,r.y,r.w,r.h,0,0,w,h);return new Promise(res=>c.toBlob(res,'image/jpeg',+$('quality').value))}function dl(b,n){let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}async function saveOne(id){let i=items.find(x=>x.id===id);dl(await output(i),i.file.name.replace(/\.[^.]+$/,'')+'_EC.jpg')}$('zip').onclick=async()=>{let z=new JSZip();for(let i of items)z.file(i.file.name.replace(/\.[^.]+$/,'')+'_EC.jpg',await output(i));dl(await z.generateAsync({type:'blob'}),'EC_images.zip')};['outW','outH'].forEach(id=>$(id).oninput=()=>items.forEach(draw));render();</script></body></html>
