<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ファイル名一括変更｜QuickTools</title>
<meta name="description" content="複数ファイルの名前を、シンプルな操作で一括変更。ベース名と連番を指定してZIP保存できます。">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f7f8fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--primary:#111827;--accent:#2563eb;--soft:#eff6ff;--ok:#166534}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fafbff 0,#f5f7fb 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink)}
header{padding:24px 18px}.wrap{max-width:920px;margin:auto}.brand{font-weight:900;font-size:18px}.hero{text-align:center;padding:42px 16px 26px}.hero h1{font-size:clamp(30px,6vw,48px);letter-spacing:-.04em;margin:0}.hero p{color:var(--muted);max-width:600px;margin:12px auto 0;line-height:1.7}.safe{display:inline-block;margin-top:14px;padding:7px 11px;border-radius:999px;background:#ecfdf3;color:#166534;font-size:12px;font-weight:800}
main{max-width:920px;margin:auto;padding:0 14px 50px}.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 18px 45px rgba(15,23,42,.06);margin-bottom:16px}.drop{border:2px dashed #cbd5e1;border-radius:18px;padding:36px 18px;text-align:center;background:#fbfdff;transition:.2s}.drop.drag{border-color:var(--accent);background:var(--soft)}.drop .icon{font-size:30px;margin-bottom:8px}.drop b{font-size:18px}.drop small{display:block;color:var(--muted);margin-top:5px}.pick{margin-top:14px;width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}
.controls{display:grid;grid-template-columns:1.7fr .8fr .8fr;gap:12px;align-items:end}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit}.example{background:#f8fafc;border-radius:14px;padding:14px;margin-top:14px;color:#475569;font-size:13px}.example b{color:var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:12px;padding:12px 16px;font-weight:850;background:var(--primary);color:#fff;cursor:pointer}button.secondary{background:#eef2f7;color:#374151}button:disabled{opacity:.45;cursor:not-allowed}.status{color:var(--ok);font-size:12px;margin-top:10px;min-height:20px}
.list{overflow:hidden;border:1px solid var(--line);border-radius:16px}.row{display:grid;grid-template-columns:1fr 34px 1fr;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid #eef1f5;font-size:13px}.row:first-child{border-top:0}.old{color:#6b7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.new{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.arrow{text-align:center;color:#9ca3af}.empty{text-align:center;color:#9ca3af;padding:28px}.summary{display:flex;justify-content:space-between;gap:12px;margin-top:12px;color:#6b7280;font-size:12px}
@media(max-width:680px){.controls{grid-template-columns:1fr}.row{grid-template-columns:1fr}.arrow{text-align:left}.actions button{width:100%}.card{padding:16px;border-radius:20px}.hero{padding-top:28px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">QuickTools</div></div></header>
<main>
<section class="hero"><h1>ファイル名を、一気に変更。</h1><p>複数ファイルを選んで、新しい名前と連番を決めるだけ。難しい設定はありません。</p><span class="safe">🔒 ファイルはブラウザ内で処理</span></section>

<section class="card">
<div id="drop" class="drop"><div class="icon">📁</div><b>ファイルを選択 / ドロップ</b><small>複数ファイルをまとめて選べます</small><input id="pick" class="pick" type="file" multiple></div>
</section>

<section class="card">
<div class="controls">
<div class="field"><label>新しいファイル名</label><input id="base" placeholder="例：CLF1088"></div>
<div class="field"><label>開始番号</label><input id="start" type="number" value="1" min="0"></div>
<div class="field"><label>桁数</label><select id="digits"><option value="1">1, 2, 3</option><option value="2" selected>01, 02, 03</option><option value="3">001, 002, 003</option></select></div>
</div>
<div id="example" class="example">例：<b>CLF1088_01.jpg</b></div>
<div class="actions"><button id="zip" disabled>変更してZIP保存</button><button id="clear" class="secondary">クリア</button></div>
<div id="status" class="status"></div>
</section>

<section class="card">
<div id="list" class="list"><div class="empty">ファイルを追加してください</div></div>
<div class="summary"><span id="count">0ファイル</span><span>元の拡張子はそのまま維持します</span></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);let files=[];
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function ext(name){const i=name.lastIndexOf('.');return i>0?name.slice(i):''}
function newName(f,i){const base=$('base').value.trim()||'file';const no=String((+$('start').value||0)+i).padStart(+$('digits').value,'0');return `${base}_${no}${ext(f.name)}`}
function render(){
 $('count').textContent=`${files.length}ファイル`;
 $('zip').disabled=!files.length;
 $('example').innerHTML=`例：<b>${esc(files.length?newName(files[0],0):(($('base').value.trim()||'CLF1088')+'_01.jpg'))}</b>`;
 if(!files.length){$('list').innerHTML='<div class="empty">ファイルを追加してください</div>';return}
 $('list').innerHTML=files.map((f,i)=>`<div class="row"><div class="old">${esc(f.name)}</div><div class="arrow">→</div><div class="new">${esc(newName(f,i))}</div></div>`).join('');
}
function add(fs){files=[...files,...fs];$('status').textContent='';render()}
$('pick').onchange=e=>{add([...e.target.files]);e.target.value=''};
['dragenter','dragover'].forEach(t=>$('drop').addEventListener(t,e=>{e.preventDefault();$('drop').classList.add('drag')}));
['dragleave','drop'].forEach(t=>$('drop').addEventListener(t,e=>{e.preventDefault();$('drop').classList.remove('drag')}));
$('drop').addEventListener('drop',e=>add([...e.dataTransfer.files]));
['base','start','digits'].forEach(id=>$(id).addEventListener('input',render));
$('clear').onclick=()=>{files=[];$('pick').value='';$('status').textContent='';render()};
$('zip').onclick=async()=>{
 if(!files.length)return;
 const names=files.map(newName);if(new Set(names).size!==names.length){alert('変更後のファイル名が重複しています。');return}
 $('zip').disabled=true;$('status').textContent='ZIPを作成中…';
 try{const z=new JSZip();files.forEach((f,i)=>z.file(names[i],f));const blob=await z.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='renamed_files.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);$('status').textContent='保存しました。'}catch(e){$('status').textContent='保存に失敗しました。'}finally{$('zip').disabled=false}
};
render();
</script>
</body>
</html>
