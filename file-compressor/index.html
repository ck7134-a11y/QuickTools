<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FileFit｜ファイル圧縮</title><meta name="description" content="画像、PDF、Excel、Word、PowerPointなど複数ファイルを圧縮。"><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f7f8fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;color:#151821}.shell{max-width:1120px;margin:auto;padding:0 18px}.topbar{padding:22px 0;display:flex;justify-content:space-between;align-items:center}.brandWrap{display:flex;align-items:center;gap:11px}.brandIcon{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#5b5cf0,#7c3aed);display:grid;place-items:center;color:#fff;font-weight:950;font-size:17px;box-shadow:0 8px 22px rgba(91,92,240,.25)}.brand{font-size:22px;font-weight:900}.brand span{color:#5b5cf0}.mini{font-size:12px;color:#737a8c}.hero{text-align:center;padding:60px 0 34px}.hero h1{font-size:clamp(38px,7vw,68px);letter-spacing:-.05em;margin:0}.hero p{color:#737a8c}.card{background:#fff;border:1px solid #e6e8ef;border-radius:24px;padding:22px;box-shadow:0 18px 50px rgba(24,24,40,.07)}.drop{border:2px dashed #c7c9d4;border-radius:20px;padding:70px 25px;text-align:center}.icon{width:64px;height:64px;border-radius:18px;background:#f3f1ff;display:grid;place-items:center;margin:auto;font-size:28px}.pick{display:inline-block;margin-top:16px;background:#151821;color:#fff;padding:12px 18px;border-radius:12px;font-weight:800;cursor:pointer}.pick input{display:none}.note{margin-top:16px;color:#47705a;background:#f7fbf8;padding:12px;border-radius:12px;font-size:12px}@media(max-width:520px){.mini{display:none}.hero{padding-top:35px}}</style></head><body><div class="shell"><header class="topbar"><div class="brandWrap"><div class="brandIcon">Q</div><div class="brand">File<span>Fit</span></div></div><div class="mini">QuickTools / Browser-based utility</div></header><section class="hero"><h1>重いファイルを、<br>ちょうどいいサイズに。</h1><p>画像・PDF・Excel・Word・PowerPointなどをまとめて圧縮。</p></section><main class="card"><div class="drop"><div class="icon">⇧</div><h2>ファイルをここにドロップ</h2><p>複数ファイルをまとめて選択できます</p><label class="pick">ファイルを選択<input type="file" multiple></label></div><div class="note">🔒 ファイルはブラウザ内で処理されます。</div></main></div></body></html>
