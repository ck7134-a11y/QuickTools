<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FileFit｜画像を指定容量まで無料圧縮</title><meta name="description" content="FileFitは画像を500KB・1MBなど指定した容量まで無料で圧縮できるブラウザツールです。ファイルは端末内で処理され、サーバーへアップロードしません。"><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}header{background:#111827;color:#fff;padding:22px 16px}header div,main{max-width:900px;margin:auto}h1{margin:0;font-size:28px}.tagline{margin:6px 0 0;color:#fff;font-size:16px;font-weight:700}.desc{margin:5px 0 0;color:#cbd5e1;font-size:13px}.card{background:#fff;border:1px solid #dbe1ea;border-radius:18px;padding:17px;margin:16px 0;box-shadow:0 8px 24px #0f172a0d}main{padding:0 12px 40px}.drop{border:2px dashed #aab6c5;border-radius:15px;padding:20px;text-align:center}.drop input{width:100%;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 120px 1fr;gap:10px}label{font-size:12px;color:#6b7280}input,select{width:100%;padding:10px;border:1px solid #dbe1ea;border-radius:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:11px;padding:12px 16px;font-weight:700;background:#2563eb;color:#fff}button.secondary{background:#eef2f7;color:#25324a}button:disabled{opacity:.45}.file{display:grid;grid-template-columns:1fr 90px 90px;gap:8px;padding:10px 0;border-top:1px solid #eef1f5;font-size:13px}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.msg{font-size:12px;color:#166534;margin-top:10px}.privacy{font-size:12px;background:#ecfdf5;color:#166534;padding:10px;border-radius:10px}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.file{grid-template-columns:1fr 75px 75px}}</style></head><body><header><div><h1>FileFit</h1><p class="tagline">ファイルを、指定容量に。</p><p class="desc">複数画像を500KB・1MBなど指定した容量まで無料で圧縮</p></div></header><main><section class="card"><div class="drop"><b>ファイルを選択</b><input id="pick" type="file" multiple accept="image/jpeg,image/png,image/webp"></div></section><section class="card"><div class="grid"><div><label>1ファイルの目標容量</label><input id="target" type="number" value="500" min="10"></div><div><label>単位</label><select id="unit"><option value="1024">KB</option><option value="1048576">MB</option></select></div><div><label>出力形式</label><select id="format"><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select></div></div><div class="actions"><button id="compress">すべて圧縮</button><button id="zip" disabled>まとめてZIP保存</button><button id="clear" class="secondary">クリア</button></div><div id="msg" class="msg"></div></section><section class="card"><div id="list">ファイルを追加してください。</div></section><div class="privacy">🔒 ファイルはブラウザ内で処理し、サーバーへアップロードしません。</div></main><script>const pick=document.querySelector('#pick'),list=document.querySelector('#list'),msg=document.querySelector('#msg'),zipBtn=document.querySelector('#zip');let files=[],results=[];const fmt=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB';function render(){if(!files.length){list.textContent='ファイルを追加してください。';return}list.innerHTML=files.map((f,i)=>'<div class="file"><div class="name">'+f.name.replace(/[&<>]/g,'')+'</div><div>'+fmt(f.size)+'</div><div>'+(results[i]?fmt(results[i].size):'—')+'</div></div>').join('')}pick.onchange=()=>{files=[...pick.files];results=[];zipBtn.disabled=true;msg.textContent='';render()};function blob(c,t,q){return new Promise((r,j)=>c.toBlob(b=>b?r(b):j(),t,q))}async function image(f,target,type){const b=await createImageBitmap(f);let scale=1,best=f;for(let r=0;r<8;r++){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(b.width*scale));c.height=Math.max(1,Math.round(b.height*scale));c.getContext('2d').drawImage(b,0,0,c.width,c.height);let lo=.15,hi=.95,fit=null;for(let i=0;i<8;i++){const q=(lo+hi)/2,x=await blob(c,type,q);if(x.size<best.size)best=x;if(x.size<=target){fit=x;lo=q}else hi=q}if(fit){best=fit;break}scale*=.8}const ext=type==='image/webp'?'.webp':'.jpg';return new File([best],f.name.replace(/\.[^.]+$/,'')+ext,{type})}document.querySelector('#compress').onclick=async()=>{if(!files.length){msg.textContent='先にファイルを選択してください。';return}msg.textContent='圧縮中…';results=[];const target=(+document.querySelector('#target').value||500)*(+document.querySelector('#unit').value),type=document.querySelector('#format').value;for(let i=0;i<files.length;i++){try{results[i]=files[i].size<=target?files[i]:await image(files[i],target,type)}catch(e){results[i]=files[i]}render()}zipBtn.disabled=false;msg.textContent='圧縮完了。ZIP保存できます。'};zipBtn.onclick=async()=>{if(!results.length)return;msg.textContent='ZIP作成中…';const z=new JSZip();results.forEach(f=>z.file(f.name,f));const b=await z.generateAsync({type:'blob'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='FileFit_compressed_files.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);msg.textContent='ZIPを保存しました。'};document.querySelector('#clear').onclick=()=>{files=[];results=[];pick.value='';zipBtn.disabled=true;msg.textContent='';render()};</script></body></html>
